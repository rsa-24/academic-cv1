bio: |
  Research Associate in the Information & Security Lab at the Indian Institute of Science (IISc), Bengaluru, working under the SPARKS Program on quantum-safe hybrid TLS protocols. My research interests include post-quantum cryptography, quantum-safe communication, hybrid cryptography, cryptographic protocols, power-grid security, cryptographic agility, symmetric cryptography, sparse modeling, signal processing, matrix estimation, and machine learning.

